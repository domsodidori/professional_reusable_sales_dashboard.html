
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reusable Sales Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:system-ui,Arial;background:#fff;color:#222;margin:24px}
h1{color:#1f8f45}
.panel,.card{border:1px solid #ddd;border-radius:10px;padding:14px}
.panel{margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{border-left:5px solid #1f8f45}
textarea{width:100%;height:110px}
button{background:#1f8f45;color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer}
canvas{max-height:320px;margin-top:26px}
small{color:#666}
</style>
</head>
<body>
<h1>Reusable Monthly Sales Dashboard</h1>
<div class="panel">
<input type="file" id="file" accept=".xlsx,.csv"><br><br>
<textarea id="paste" placeholder="Paste Date and Sales columns from Excel"></textarea><br>
<button id="go">Update Dashboard</button><br><small>Column names are detected automatically (Date/Month/Period + Sales/Revenue/Total Sales).</small>
</div>

<div class="cards">
<div class="card"><b>Latest Sales</b><div id="latest"></div></div>
<div class="card"><b>YoY Growth</b><div id="yoykpi"></div></div>
<div class="card"><b>5-Year CAGR</b><div id="cagr"></div></div>
<div class="card"><b>Growth Trend</b><div id="trend"></div></div>
</div>

<canvas id="salesChart"></canvas>
<canvas id="yoyChart"></canvas>
<canvas id="rollChart"></canvas>

<script>
let charts=[];

function destroyCharts(){charts.forEach(c=>c.destroy());charts=[];}

function norm(v){
 if(v==null) return "";
 return String(v).toLowerCase().trim();
}
function findCol(headers,words){
 return headers.findIndex(h=>words.some(w=>norm(h).includes(w)));
}
function excelDate(v){
 if(typeof v==="number") return new Date((v-25569)*86400000);
 return new Date(v);
}
function parseMoney(v){
 if(typeof v==="number") return v;
 let s=String(v).replace(/[$€£,% ]/g,"").replace(/,/g,"");
 return Number(s);
}
function parseRows(rows){
 const h=rows[0];
 const dcol=findCol(h,["date","month","period","datum"]);
 const scol=findCol(h,["sales","revenue","total"]);
 if(dcol<0||scol<0) throw new Error("Couldn't detect Date and Sales columns.");
 const out=[];
 for(let i=1;i<rows.length;i++){
   const d=excelDate(rows[i][dcol]);
   const s=parseMoney(rows[i][scol]);
   if(isNaN(d)||!isFinite(s)) continue;
   out.push({date:d,sales:s});
 }
 out.sort((a,b)=>a.date-b.date);
 return out;
}
function yoy(data){return data.map((r,i)=>i<12?null:(r.sales/data[i-12].sales-1)*100);}
function rolling(data){return data.map((_,i)=>i<11?null:data.slice(i-11,i+1).reduce((a,b)=>a+b.sales,0));}
function cagr(data){
 if(data.length<61) return null;
 const start=data[data.length-61].sales,end=data[data.length-1].sales;
 return (Math.pow(end/start,1/5)-1)*100;
}
function growthTrend(y){
 const v=y.filter(x=>x!=null);
 if(v.length<24) return "Stable";
 const a=v.slice(-12).reduce((x,y)=>x+y)/12;
 const b=v.slice(-24,-12).reduce((x,y)=>x+y)/12;
 if(a>b+1) return "Accelerating";
 if(a<b-1) return "Slowing";
 return "Stable";
}
function line(id,label,labels,data){
 return new Chart(document.getElementById(id),{
   type:"line",
   data:{labels,datasets:[{label,data,borderColor:"#1f8f45",tension:.25}]},
   options:{responsive:true}
 });
}
function render(data){
 destroyCharts();
 const labels=data.map(x=>x.date.toISOString().slice(0,7));
 const y=yoy(data), r=rolling(data), cg=cagr(data);
 latest.textContent=data.at(-1).sales.toLocaleString();
 yoykpi.textContent=y.at(-1)==null?"N/A":y.at(-1).toFixed(1)+"%";
 cagr.textContent=cg==null?"N/A":cg.toFixed(2)+"%";
 trend.textContent=growthTrend(y);
 charts.push(line("salesChart","Sales",labels,data.map(x=>x.sales)));
 charts.push(line("yoyChart","YoY Growth %",labels,y));
 charts.push(line("rollChart","Rolling 12M Sales",labels,r));
}
async function loadRows(){
 const f=file.files[0];
 if(f){
   if(f.name.toLowerCase().endsWith(".csv")){
     return (await f.text()).split(/\r?\n/).map(r=>r.split(/,|\t/));
   }
   const wb=XLSX.read(await f.arrayBuffer());
   for(const s of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,raw:true});
      try{parseRows(rows);return rows;}catch(e){}
   }
   throw new Error("No worksheet with Date and Sales columns found.");
 }
 const t=paste.value.trim();
 if(!t) throw new Error("Upload a file or paste data.");
 return t.split(/\r?\n/).map(r=>r.split("\t").length>1?r.split("\t"):r.split(","));
}
go.onclick=async()=>{
 try{
   const rows=await loadRows();
   render(parseRows(rows));
 }catch(e){alert(e.message);}
};
</script>
</body>
</html>
